<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 watch & react · share site</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #0b0f17;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .app {
      max-width: 1400px;
      width: 100%;
      background: #1a1f2b;
      border-radius: 2rem;
      padding: 1.8rem 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid #2e3a4b;
    }

    h1 {
      text-align: center;
      font-weight: 500;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      color: #f0f3fa;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    h1 span {
      background: #2e3a4b;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 400;
      color: #9eb7d9;
    }

    /* Video grid */
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }

    .video-card {
      background: #0d121c;
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      border: 1px solid #2e3a4b;
      aspect-ratio: 4 / 3;
      position: relative;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #05080e;
      transform: scaleX(-1);
    }

    .video-card.remote video { transform: scaleX(1); }

    .label {
      position: absolute;
      bottom: 10px;
      left: 14px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      padding: 0.2rem 0.8rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #eef3ff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }

    button {
      background: #2e3a4b;
      border: none;
      color: #f0f4fe;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.7rem 1.5rem;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      border: 1px solid #3f4e63;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    button:hover:not(:disabled) {
      background: #3d4d63;
      border-color: #5e74a0;
      transform: scale(1.02);
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    .primary { background: #3b6eff; border-color: #5a86ff; color: white; }
    .primary:hover:not(:disabled) { background: #2e5ae0; }
    .secondary { background: #2a3548; }
    .danger { background: #b33a4b; border-color: #d45c6e; }
    .danger:hover:not(:disabled) { background: #9e2f3f; }

    /* Signal area */
    .signal-box {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      background: #0d121c;
      border-radius: 1.2rem;
      padding: 1.2rem;
      border: 1px solid #2e3a4b;
      margin-bottom: 1rem;
    }

    .signal-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
    }

    .signal-row label {
      font-size: 0.85rem;
      color: #9eb7d9;
      font-weight: 500;
      min-width: 90px;
    }

    textarea {
      flex: 1;
      background: #070b12;
      border: 1px solid #2e3a4b;
      border-radius: 0.8rem;
      padding: 0.6rem 0.9rem;
      color: #d2e0f5;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      resize: vertical;
      min-height: 60px;
    }

    textarea:focus { outline: none; border-color: #3b6eff; box-shadow: 0 0 0 3px rgba(59, 110, 255, 0.2); }

    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #a7bbdd;
      background: #0e141f;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      border: 1px solid #2e3a4b;
      margin-top: 0.3rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #b33a4b;
      display: inline-block;
    }

    .dot.connected { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }

    /* Web share section */
    .share-section {
      background: #0d121c;
      border-radius: 1.2rem;
      padding: 1.2rem;
      border: 1px solid #2e3a4b;
      margin-bottom: 0.8rem;
    }

    .share-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .share-header h2 {
      font-size: 1.1rem;
      font-weight: 500;
      color: #c9d9f0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .url-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
    }

    .url-bar input {
      flex: 1;
      background: #070b12;
      border: 1px solid #2e3a4b;
      border-radius: 2rem;
      padding: 0.6rem 1.2rem;
      color: #d2e0f5;
      font-size: 0.9rem;
      min-width: 200px;
    }

    .url-bar input:focus { outline: none; border-color: #3b6eff; }

    .url-bar button {
      padding: 0.6rem 1.4rem;
      font-size: 0.85rem;
      background: #3b6eff;
      border-color: #5a86ff;
    }

    .iframe-container {
      width: 100%;
      height: 380px;
      background: #05080e;
      border-radius: 0.8rem;
      border: 1px solid #2e3a4b;
      overflow: hidden;
      position: relative;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .iframe-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #4a5c78;
      font-size: 0.95rem;
      text-align: center;
      padding: 1rem;
    }

    .footer-note {
      text-align: center;
      color: #5e6f8a;
      font-size: 0.7rem;
      margin-top: 0.6rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🎥 watch & react <span>webrtc + shared site</span></h1>

    <!-- Video grid -->
    <div class="video-grid">
      <div class="video-card">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="label">You</div>
      </div>
      <div class="video-card remote">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="label">Friend</div>
      </div>
    </div>

    <!-- Call controls -->
    <div class="controls">
      <button id="startBtn" class="primary">🎬 Start camera & mic</button>
      <button id="callBtn" class="secondary" disabled>📞 Call friend</button>
      <button id="hangupBtn" class="danger" disabled>✖ Hang up</button>
    </div>

    <!-- Signaling (offer/answer) -->
    <div class="signal-box">
      <div class="signal-row">
        <label>📤 Your offer</label>
        <textarea id="offerText" placeholder="Click 'Call friend' to generate offer..." readonly></textarea>
        <button id="copyOfferBtn" disabled>Copy</button>
      </div>
      <div class="signal-row">
        <label>📥 Remote answer</label>
        <textarea id="answerText" placeholder="Paste friend's answer here..." ></textarea>
        <button id="applyAnswerBtn" disabled>Apply</button>
      </div>
      <div class="status-badge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Ready — start camera</span>
      </div>
    </div>

    <!-- Website sharing section -->
    <div class="share-section">
      <div class="share-header">
        <h2>🌐 Share a website</h2>
        <span style="font-size:0.75rem; color:#6b7f9e;">loads for both of you</span>
      </div>
      <div class="url-bar">
        <input type="url" id="urlInput" placeholder="https://example.com" value="https://example.com">
        <button id="loadUrlBtn">Load</button>
      </div>
      <div class="iframe-container" id="iframeContainer">
        <div class="iframe-placeholder" id="iframePlaceholder">
          No site loaded yet — paste a URL and click "Load"
        </div>
        <iframe id="sharedIframe" style="display:none;" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
      </div>
    </div>

    <div class="footer-note">
      No external services · pure WebRTC · shared website via iframe + data channel
    </div>
  </div>

  <script>
    (function() {
      // ----- DOM references -----
      const localVideo = document.getElementById('localVideo');
      const remoteVideo = document.getElementById('remoteVideo');
      const startBtn = document.getElementById('startBtn');
      const callBtn = document.getElementById('callBtn');
      const hangupBtn = document.getElementById('hangupBtn');
      const offerText = document.getElementById('offerText');
      const answerText = document.getElementById('answerText');
      const copyOfferBtn = document.getElementById('copyOfferBtn');
      const applyAnswerBtn = document.getElementById('applyAnswerBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const urlInput = document.getElementById('urlInput');
      const loadUrlBtn = document.getElementById('loadUrlBtn');
      const sharedIframe = document.getElementById('sharedIframe');
      const iframePlaceholder = document.getElementById('iframePlaceholder');
      const iframeContainer = document.getElementById('iframeContainer');

      // ----- state -----
      let localStream = null;
      let peerConnection = null;
      let dataChannel = null;
      let currentOffer = null;
      let isCaller = false;
      let isReceiver = false;

      const rtcConfig = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      };

      // ----- helper: status -----
      function updateStatus(msg, connected = false) {
        statusText.textContent = msg;
        statusDot.classList.toggle('connected', connected);
      }

      // ----- enable/disable buttons -----
      function setButtonsState() {
        const hasLocal = !!localStream;
        const hasPeer = !!peerConnection;
        const peerOpen = hasPeer && peerConnection.connectionState !== 'closed' && peerConnection.connectionState !== 'failed';

        startBtn.disabled = hasLocal;
        callBtn.disabled = !hasLocal || peerOpen;
        hangupBtn.disabled = !hasPeer;

        copyOfferBtn.disabled = !offerText.value.trim();

        if (isCaller && hasPeer) {
          applyAnswerBtn.disabled = !answerText.value.trim();
        } else if (!hasPeer && !isCaller && hasLocal) {
          applyAnswerBtn.disabled = !answerText.value.trim();
        } else {
          applyAnswerBtn.disabled = true;
        }
      }

      // ----- close peer & data channel -----
      function closePeerConnection() {
        if (dataChannel) {
          dataChannel.onopen = null;
          dataChannel.onmessage = null;
          dataChannel.onclose = null;
          dataChannel.close();
          dataChannel = null;
        }
        if (peerConnection) {
          peerConnection.onicecandidate = null;
          peerConnection.ontrack = null;
          peerConnection.onconnectionstatechange = null;
          peerConnection.ondatachannel = null;
          peerConnection.close();
          peerConnection = null;
        }
        remoteVideo.srcObject = null;
        offerText.value = '';
        currentOffer = null;
        isCaller = false;
        isReceiver = false;
        updateStatus('Disconnected', false);
        setButtonsState();
      }

      // ----- stop local stream -----
      function stopLocalStream() {
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
          localStream = null;
        }
        localVideo.srcObject = null;
        setButtonsState();
      }

      // ----- SHARED WEBSITE: load URL into iframe (local) and broadcast via datachannel -----
      function loadSharedWebsite(url) {
        if (!url || !url.startsWith('http')) {
          alert('Please enter a valid URL starting with http:// or https://');
          return;
        }
        // set iframe src
        sharedIframe.src = url;
        sharedIframe.style.display = 'block';
        iframePlaceholder.style.display = 'none';

        // broadcast to remote via data channel if open
        if (dataChannel && dataChannel.readyState === 'open') {
          dataChannel.send(JSON.stringify({ type: 'load_url', url: url }));
        } else {
          console.log('Data channel not open, URL not broadcasted.');
        }
      }

      // ----- receive URL from datachannel (remote) -----
      function receiveRemoteUrl(url) {
        if (!url || !url.startsWith('http')) return;
        sharedIframe.src = url;
        sharedIframe.style.display = 'block';
        iframePlaceholder.style.display = 'none';
        // also update the input field so the user sees what's loaded
        urlInput.value = url;
        updateStatus('Friend loaded a site', false);
      }

      // ----- setup data channel (common to both caller and receiver) -----
      function setupDataChannel(channel) {
        dataChannel = channel;
        dataChannel.onopen = () => {
          console.log('Data channel open');
          updateStatus('Data channel ready', true);
        };
        dataChannel.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'load_url' && msg.url) {
              receiveRemoteUrl(msg.url);
            }
          } catch (e) {
            console.warn('Invalid data channel message', e);
          }
        };
        dataChannel.onclose = () => {
          console.log('Data channel closed');
          dataChannel = null;
        };
      }

      // ----- START CAMERA -----
      startBtn.addEventListener('click', async () => {
        if (localStream) return;
        try {
          updateStatus('Requesting camera & mic...', false);
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480 },
            audio: true
          });
          localStream = stream;
          localVideo.srcObject = stream;
          updateStatus('Camera ready', false);
          setButtonsState();
        } catch (err) {
          updateStatus('❌ ' + err.message, false);
          alert('Camera error: ' + err.message);
        }
      });

      // ----- CALLER: create offer + data channel -----
      callBtn.addEventListener('click', async () => {
        if (!localStream) return;
        if (peerConnection) closePeerConnection();

        try {
          updateStatus('Creating offer...', false);
          isCaller = true;
          isReceiver = false;
          peerConnection = new RTCPeerConnection(rtcConfig);

          // create data channel (caller creates it)
          const dc = peerConnection.createDataChannel('shared-site');
          setupDataChannel(dc);

          // listen for remote data channel (in case receiver creates one - but we use caller-created)
          peerConnection.ondatachannel = (event) => {
            // if receiver also creates a channel we ignore, but we can handle it just in case
            console.log('Remote data channel received (ignored, using caller-created)');
          };

          localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

          peerConnection.onicecandidate = (e) => {
            if (e.candidate) console.log('ICE', e.candidate);
          };

          peerConnection.ontrack = (e) => {
            const [remoteStream] = e.streams;
            remoteVideo.srcObject = remoteStream;
            updateStatus('Friend connected 🎬', true);
          };

          peerConnection.onconnectionstatechange = () => {
            if (!peerConnection) return;
            const state = peerConnection.connectionState;
            if (state === 'connected') updateStatus('Friend connected 🎬', true);
            else if (state === 'disconnected' || state === 'failed') updateStatus('Connection lost', false);
            setButtonsState();
          };

          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);

          await new Promise(resolve => {
            if (peerConnection.iceGatheringState === 'complete') return resolve();
            const check = () => {
              if (peerConnection.iceGatheringState === 'complete') {
                peerConnection.removeEventListener('icegatheringstatechange', check);
                resolve();
              }
            };
            peerConnection.addEventListener('icegatheringstatechange', check);
            setTimeout(resolve, 3000);
          });

          currentOffer = peerConnection.localDescription;
          offerText.value = JSON.stringify(currentOffer.toJSON(), null, 2);
          updateStatus('Offer ready — share', false);
          setButtonsState();
        } catch (err) {
          console.error(err);
          updateStatus('❌ ' + err.message, false);
          closePeerConnection();
        }
      });

      // ----- APPLY (caller: apply answer / receiver: process offer) -----
      applyAnswerBtn.addEventListener('click', async () => {
        const text = answerText.value.trim();
        if (!text) return;

        // ---- CALLER: apply remote answer ----
        if (isCaller && peerConnection) {
          try {
            const answer = JSON.parse(text);
            if (!answer.type || !answer.sdp) throw new Error('Invalid answer');
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            updateStatus('Answer applied — connecting...', false);
            setButtonsState();
          } catch (err) {
            alert('Invalid answer: ' + err.message);
          }
          return;
        }

        // ---- RECEIVER: process offer, create answer ----
        if (!localStream) {
          alert('Start your camera first before receiving an offer.');
          return;
        }
        if (peerConnection) {
          alert('Already in a call. Hang up first.');
          return;
        }

        try {
          const offer = JSON.parse(text);
          if (!offer.type || !offer.sdp) throw new Error('Invalid offer');

          updateStatus('Processing offer...', false);
          isReceiver = true;
          isCaller = false;

          peerConnection = new RTCPeerConnection(rtcConfig);

          // receiver: listen for data channel created by caller
          peerConnection.ondatachannel = (event) => {
            setupDataChannel(event.channel);
          };

          localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

          peerConnection.onicecandidate = (e) => {
            if (e.candidate) console.log('ICE', e.candidate);
          };

          peerConnection.ontrack = (e) => {
            const [remoteStream] = e.streams;
            remoteVideo.srcObject = remoteStream;
            updateStatus('Friend connected 🎬', true);
          };

          peerConnection.onconnectionstatechange = () => {
            if (!peerConnection) return;
            const state = peerConnection.connectionState;
            if (state === 'connected') updateStatus('Friend connected 🎬', true);
            else if (state === 'disconnected' || state === 'failed') updateStatus('Connection lost', false);
            setButtonsState();
          };

          await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);

          await new Promise(resolve => {
            if (peerConnection.iceGatheringState === 'complete') return resolve();
            const check = () => {
              if (peerConnection.iceGatheringState === 'complete') {
                peerConnection.removeEventListener('icegatheringstatechange', check);
                resolve();
              }
            };
            peerConnection.addEventListener('icegatheringstatechange', check);
            setTimeout(resolve, 3000);
          });

          offerText.value = JSON.stringify(peerConnection.localDescription.toJSON(), null, 2);
          updateStatus('Answer ready — copy and send back', false);
          setButtonsState();
        } catch (err) {
          console.error(err);
          updateStatus('❌ ' + err.message, false);
          if (peerConnection) closePeerConnection();
        }
      });

      // ----- COPY offer/answer -----
      copyOfferBtn.addEventListener('click', () => {
        const txt = offerText.value;
        if (!txt) return;
        navigator.clipboard.writeText(txt).then(() => {
          updateStatus('Copied to clipboard', false);
          setTimeout(() => {
            if (peerConnection && peerConnection.connectionState === 'connected') {
              updateStatus('Friend connected 🎬', true);
            } else {
              updateStatus('Ready', false);
            }
          }, 1500);
        }).catch(() => alert('Copy failed'));
      });

      // ----- HANGUP -----
      hangupBtn.addEventListener('click', () => {
        closePeerConnection();
        answerText.value = '';
        updateStatus('Call ended', false);
        setButtonsState();
      });

      // ----- update button state on text input -----
      answerText.addEventListener('input', setButtonsState);
      offerText.addEventListener('input', setButtonsState);

      // ----- SHARE WEBSITE: local load button -----
      loadUrlBtn.addEventListener('click', () => {
        let url = urlInput.value.trim();
        if (!url.startsWith('http')) {
          url = 'https://' + url;
        }
        loadSharedWebsite(url);
      });

      // also allow pressing Enter in URL input
      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          loadUrlBtn.click();
        }
      });

      // ----- initialize UI -----
      setButtonsState();
      updateStatus('Ready — start camera', false);

      // clean up on unload
      window.addEventListener('beforeunload', () => {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (peerConnection) peerConnection.close();
        if (dataChannel) dataChannel.close();
      });

    })();
  </script>
</body>
</html>
