<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 watch & react · screen share</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #0b0f17;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .app {
      max-width: 1400px;
      width: 100%;
      background: #1a1f2b;
      border-radius: 2rem;
      padding: 1.8rem 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid #2e3a4b;
    }

    h1 {
      text-align: center;
      font-weight: 500;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      color: #f0f3fa;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    h1 span {
      background: #2e3a4b;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 400;
      color: #9eb7d9;
    }

    /* Layout: movie (big) + reactions (small) */
    .main-grid {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }

    .screen-card {
      background: #0d121c;
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      border: 1px solid #2e3a4b;
      aspect-ratio: 16 / 9;
      position: relative;
    }

    .screen-card video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .reaction-column {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .video-card {
      background: #0d121c;
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      border: 1px solid #2e3a4b;
      aspect-ratio: 4 / 3;
      position: relative;
      flex: 1;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #05080e;
      transform: scaleX(-1);
    }

    .video-card.remote video { transform: scaleX(1); }

    .label {
      position: absolute;
      bottom: 10px;
      left: 14px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      padding: 0.2rem 0.8rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #eef3ff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 2;
    }

    .label.sharing {
      background: rgba(46, 204, 113, 0.75);
      border-color: #2ecc71;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }

    button {
      background: #2e3a4b;
      border: none;
      color: #f0f4fe;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.7rem 1.5rem;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      border: 1px solid #3f4e63;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    button:hover:not(:disabled) {
      background: #3d4d63;
      border-color: #5e74a0;
      transform: scale(1.02);
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    .primary { background: #3b6eff; border-color: #5a86ff; color: white; }
    .primary:hover:not(:disabled) { background: #2e5ae0; }
    .secondary { background: #2a3548; }
    .success { background: #1f8a4c; border-color: #2ecc71; }
    .success:hover:not(:disabled) { background: #16703d; }
    .danger { background: #b33a4b; border-color: #d45c6e; }
    .danger:hover:not(:disabled) { background: #9e2f3f; }

    /* Signal area */
    .signal-box {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      background: #0d121c;
      border-radius: 1.2rem;
      padding: 1.2rem;
      border: 1px solid #2e3a4b;
      margin-bottom: 0.6rem;
    }

    .signal-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
    }

    .signal-row label {
      font-size: 0.85rem;
      color: #9eb7d9;
      font-weight: 500;
      min-width: 90px;
    }

    textarea {
      flex: 1;
      background: #070b12;
      border: 1px solid #2e3a4b;
      border-radius: 0.8rem;
      padding: 0.6rem 0.9rem;
      color: #d2e0f5;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      resize: vertical;
      min-height: 60px;
    }

    textarea:focus { outline: none; border-color: #3b6eff; box-shadow: 0 0 0 3px rgba(59, 110, 255, 0.2); }

    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #a7bbdd;
      background: #0e141f;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      border: 1px solid #2e3a4b;
      margin-top: 0.3rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #b33a4b;
      display: inline-block;
    }

    .dot.connected { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }

    .footer-note {
      text-align: center;
      color: #5e6f8a;
      font-size: 0.7rem;
      margin-top: 0.6rem;
    }

    .hint {
      text-align: center;
      font-size: 0.8rem;
      color: #7d8fa8;
      margin-bottom: 1rem;
      padding: 0.6rem 1rem;
      background: #0e141f;
      border-radius: 1rem;
      border: 1px dashed #2e3a4b;
    }

    @media (max-width: 800px) {
      .main-grid { grid-template-columns: 1fr; }
      .reaction-column { flex-direction: row; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🎥 watch & react <span>webrtc screen share</span></h1>

    <div class="hint">
      💡 To watch a movie together: play the movie in another tab/window,
      then click <strong>Share screen</strong> and pick that tab. Your friend will see it here.
    </div>

    <!-- Movie screen + reaction cameras -->
    <div class="main-grid">
      <!-- Shared screen (movie) -->
      <div class="screen-card">
        <video id="remoteScreen" autoplay playsinline></video>
        <div class="label" id="screenLabel">Movie (friend's screen)</div>
      </div>

      <!-- Reaction cameras -->
      <div class="reaction-column">
        <div class="video-card">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="label">You</div>
        </div>
        <div class="video-card remote">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="label">Friend</div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="startBtn" class="primary">🎬 Start camera & mic</button>
      <button id="shareBtn" class="success" disabled>🖥️ Share screen</button>
      <button id="stopShareBtn" class="secondary" disabled>⏹ Stop sharing</button>
      <button id="callBtn" class="secondary" disabled>📞 Call friend</button>
      <button id="hangupBtn" class="danger" disabled>✖ Hang up</button>
    </div>

    <!-- Signaling -->
    <div class="signal-box">
      <div class="signal-row">
        <label>📤 Your offer</label>
        <textarea id="offerText" placeholder="Click 'Call friend' to generate offer..." readonly></textarea>
        <button id="copyOfferBtn" disabled>Copy</button>
      </div>
      <div class="signal-row">
        <label>📥 Remote answer</label>
        <textarea id="answerText" placeholder="Paste friend's answer here..."></textarea>
        <button id="applyAnswerBtn" disabled>Apply</button>
      </div>
      <div class="status-badge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Ready — start camera</span>
      </div>
    </div>

    <div class="footer-note">
      No external services · pure WebRTC · screen share + reactions
    </div>
  </div>

  <script>
    (function() {
      // ----- DOM -----
      const localVideo = document.getElementById('localVideo');
      const remoteVideo = document.getElementById('remoteVideo');
      const remoteScreen = document.getElementById('remoteScreen');
      const screenLabel = document.getElementById('screenLabel');
      const startBtn = document.getElementById('startBtn');
      const shareBtn = document.getElementById('shareBtn');
      const stopShareBtn = document.getElementById('stopShareBtn');
      const callBtn = document.getElementById('callBtn');
      const hangupBtn = document.getElementById('hangupBtn');
      const offerText = document.getElementById('offerText');
      const answerText = document.getElementById('answerText');
      const copyOfferBtn = document.getElementById('copyOfferBtn');
      const applyAnswerBtn = document.getElementById('applyAnswerBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      // ----- state -----
      let localStream = null;          // camera + mic
      let screenStream = null;         // screen capture
      let peerConnection = null;
      let currentOffer = null;
      let isCaller = false;

      const rtcConfig = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      };

      // Track which sender belongs to what (so we can replace tracks)
      let camSender = null;   // video sender for camera
      let screenSender = null; // video sender for screen share
      let audioSender = null;

      // ----- helpers -----
      function updateStatus(msg, connected = false) {
        statusText.textContent = msg;
        statusDot.classList.toggle('connected', connected);
      }

      function setButtonsState() {
        const hasLocal = !!localStream;
        const hasPeer = !!peerConnection;
        const peerOpen = hasPeer && peerConnection.connectionState !== 'closed' && peerConnection.connectionState !== 'failed';

        startBtn.disabled = hasLocal;
        callBtn.disabled = !hasLocal || peerOpen;
        hangupBtn.disabled = !hasPeer;

        shareBtn.disabled = !hasLocal || !!screenStream;
        stopShareBtn.disabled = !screenStream;

        copyOfferBtn.disabled = !offerText.value.trim();

        if (isCaller && hasPeer) {
          applyAnswerBtn.disabled = !answerText.value.trim();
        } else if (!hasPeer && !isCaller && hasLocal) {
          applyAnswerBtn.disabled = !answerText.value.trim();
        } else {
          applyAnswerBtn.disabled = true;
        }
      }

      function closePeerConnection() {
        if (peerConnection) {
          peerConnection.onicecandidate = null;
          peerConnection.ontrack = null;
          peerConnection.onconnectionstatechange = null;
          peerConnection.close();
          peerConnection = null;
        }
        camSender = null;
        screenSender = null;
        audioSender = null;
        remoteVideo.srcObject = null;
        remoteScreen.srcObject = null;
        screenLabel.textContent = 'Movie (friend\'s screen)';
        screenLabel.classList.remove('sharing');
        offerText.value = '';
        currentOffer = null;
        isCaller = false;
        updateStatus('Disconnected', false);
        setButtonsState();
      }

      function stopScreenShare() {
        if (screenStream) {
          screenStream.getTracks().forEach(t => t.stop());
          screenStream = null;
        }
        // Replace screen track with camera track on the sender (if in a call)
        if (peerConnection && camSender && localStream) {
          const camTrack = localStream.getVideoTracks()[0];
          if (camTrack) {
            camSender.replaceTrack(camTrack).catch(err => console.warn('replaceTrack failed', err));
          }
        }
        screenSender = null;
        updateStatus('Screen share stopped', !!peerConnection);
        setButtonsState();
      }

      // ----- START CAMERA + MIC -----
      startBtn.addEventListener('click', async () => {
        if (localStream) return;
        try {
          updateStatus('Requesting camera & mic...', false);
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480 },
            audio: true
          });
          localStream = stream;
          localVideo.srcObject = stream;
          updateStatus('Camera ready', false);
          setButtonsState();
        } catch (err) {
          updateStatus('❌ ' + err.message, false);
          alert('Camera error: ' + err.message);
        }
      });

      // ----- SHARE SCREEN -----
      shareBtn.addEventListener('click', async () => {
        if (screenStream) return;
        try {
          updateStatus('Requesting screen share...', false);
          // Ask user to pick a tab/window/screen
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: 'always' },
            audio: false // set true if you want to capture tab audio (browser-dependent)
          });

          screenStream = stream;

          // If in a call, replace the camera video track with the screen track
          if (peerConnection && camSender) {
            const screenTrack = stream.getVideoTracks()[0];
            await camSender.replaceTrack(screenTrack);
            screenSender = camSender;
          }

          // Auto-stop when user clicks browser's "Stop sharing" button
          stream.getVideoTracks()[0].onended = () => {
            stopScreenShare();
          };

          updateStatus('Sharing screen — friend sees it', !!peerConnection);
          setButtonsState();
        } catch (err) {
          // User cancelled the picker — no need to alert aggressively
          if (err.name !== 'NotAllowedError') {
            alert('Screen share error: ' + err.message);
          }
          updateStatus('Screen share cancelled', false);
          setButtonsState();
        }
      });

      // ----- STOP SHARING -----
      stopShareBtn.addEventListener('click', () => {
        stopScreenShare();
      });

      // ----- CALLER: create offer + tracks -----
      callBtn.addEventListener('click', async () => {
        if (!localStream) return;
        if (peerConnection) closePeerConnection();

        try {
          updateStatus('Creating offer...', false);
          isCaller = true;
          peerConnection = new RTCPeerConnection(rtcConfig);

          // Add camera video + audio (always send reactions)
          const camTrack = localStream.getVideoTracks()[0];
          const micTrack = localStream.getAudioTracks()[0];

          if (camTrack) camSender = peerConnection.addTrack(camTrack, localStream);
          if (micTrack) audioSender = peerConnection.addTrack(micTrack, localStream);

          // If already sharing screen, add screen track too (as a second video track)
          // Note: multiple video tracks require careful handling on receiver side.
          // Simpler approach: we use ONE video track at a time (cam OR screen),
          // and the receiver distinguishes them by stream label. But we want
          // BOTH camera reactions AND movie screen simultaneously!
          // So we need TWO video tracks from the sender.
          // We'll add screen track if available.
          if (screenStream) {
            const screenTrack = screenStream.getVideoTracks()[0];
            screenSender = peerConnection.addTrack(screenTrack, screenStream);
            // It's ok to pass the screenStream as a separate stream.
          }

          peerConnection.onicecandidate = (e) => {
            if (e.candidate) console.log('ICE', e.candidate);
          };

          peerConnection.ontrack = (e) => {
            console.log('ontrack', e.track.kind, e.streams);
            const [remoteStream] = e.streams;
            // Distinguish: if it's a video track from a "screen" stream, or audio-only
            // We'll use heuristics: the first video track we receive -> camera
            // The second video track -> screen share.
            // Also handle audio separately.
            if (e.track.kind === 'video') {
              // Check if the remoteScreen already has a srcObject assigned
              // Actually assign streams intelligently:
              // - If remoteStream has a track that matches a stream with a track labeled "screen"
              // Better: use the track label. getDisplayMedia track labels usually include "screen".
              // But labels may not be reliable across browsers.
              // Robust approach: count video tracks received.
              handleRemoteVideoTrack(e.track, remoteStream);
            } else if (e.track.kind === 'audio') {
              // attach audio to the reaction video (so we hear friend's mic)
              remoteVideo.srcObject = remoteStream;
            }
          };

          let remoteVideoTrackCount = 0;
          function handleRemoteVideoTrack(track, stream) {
            remoteVideoTrackCount++;
            if (remoteVideoTrackCount === 1) {
              // First video track = camera reaction
              remoteVideo.srcObject = stream;
            } else {
              // Second video track = screen share
              remoteScreen.srcObject = stream;
              screenLabel.textContent = 'Movie (friend\'s screen)';
              screenLabel.classList.add('sharing');
            }
            // Also if it's the only video track but stream has "screen" in its id, treat as screen
            if (remoteVideoTrackCount === 1 && stream.id && stream.id.toLowerCase().includes('screen')) {
              remoteScreen.srcObject = stream;
              screenLabel.textContent = 'Movie (friend\'s screen)';
              screenLabel.classList.add('sharing');
              remoteVideo.srcObject = null;
            }
          }

          peerConnection.onconnectionstatechange = () => {
            if (!peerConnection) return;
            const state = peerConnection.connectionState;
            if (state === 'connected') updateStatus('Friend connected 🎬', true);
            else if (state === 'disconnected' || state === 'failed') updateStatus('Connection lost', false);
            setButtonsState();
          };

          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);

          await new Promise(resolve => {
            if (peerConnection.iceGatheringState === 'complete') return resolve();
            const check = () => {
              if (peerConnection.iceGatheringState === 'complete') {
                peerConnection.removeEventListener('icegatheringstatechange', check);
                resolve();
              }
            };
            peerConnection.addEventListener('icegatheringstatechange', check);
            setTimeout(resolve, 3000);
          });

          currentOffer = peerConnection.localDescription;
          offerText.value = JSON.stringify(currentOffer.toJSON(), null, 2);
          updateStatus('Offer ready — share', false);
          setButtonsState();
        } catch (err) {
          console.error(err);
          updateStatus('❌ ' + err.message, false);
          closePeerConnection();
        }
      });

      // ----- APPLY (caller: apply answer / receiver: process offer) -----
      applyAnswerBtn.addEventListener('click', async () => {
        const text = answerText.value.trim();
        if (!text) return;

        // CALLER: apply remote answer
        if (isCaller && peerConnection) {
          try {
            const answer = JSON.parse(text);
            if (!answer.type || !answer.sdp) throw new Error('Invalid answer');
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            updateStatus('Answer applied — connecting...', false);
            setButtonsState();
          } catch (err) {
            alert('Invalid answer: ' + err.message);
          }
          return;
        }

        // RECEIVER: process offer, create answer
        if (!localStream) {
          alert('Start your camera first before receiving an offer.');
          return;
        }
        if (peerConnection) {
          alert('Already in a call. Hang up first.');
          return;
        }

        try {
          const offer = JSON.parse(text);
          if (!offer.type || !offer.sdp) throw new Error('Invalid offer');

          updateStatus('Processing offer...', false);
          isCaller = false;

          peerConnection = new RTCPeerConnection(rtcConfig);

          // Add our camera + mic
          const camTrack = localStream.getVideoTracks()[0];
          const micTrack = localStream.getAudioTracks()[0];
          if (camTrack) camSender = peerConnection.addTrack(camTrack, localStream);
          if (micTrack) audioSender = peerConnection.addTrack(micTrack, localStream);

          // If we're already sharing our screen, add it too
          if (screenStream) {
            const screenTrack = screenStream.getVideoTracks()[0];
            screenSender = peerConnection.addTrack(screenTrack, screenStream);
          }

          // Receive remote tracks
          let remoteVideoTrackCount = 0;
          peerConnection.ontrack = (e) => {
            const [remoteStream] = e.streams;
            if (e.track.kind === 'video') {
              remoteVideoTrackCount++;
              if (remoteVideoTrackCount === 1) {
                remoteVideo.srcObject = remoteStream;
              } else {
                remoteScreen.srcObject = remoteStream;
                screenLabel.textContent = 'Movie (friend\'s screen)';
                screenLabel.classList.add('sharing');
              }
            } else if (e.track.kind === 'audio') {
              remoteVideo.srcObject = remoteStream;
            }
          };

          peerConnection.onconnectionstatechange = () => {
            if (!peerConnection) return;
            const state = peerConnection.connectionState;
            if (state === 'connected') updateStatus('Friend connected 🎬', true);
            else if (state === 'disconnected' || state === 'failed') updateStatus('Connection lost', false);
            setButtonsState();
          };

          await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);

          await new Promise(resolve => {
            if (peerConnection.iceGatheringState === 'complete') return resolve();
            const check = () => {
              if (peerConnection.iceGatheringState === 'complete') {
                peerConnection.removeEventListener('icegatheringstatechange', check);
                resolve();
              }
            };
            peerConnection.addEventListener('icegatheringstatechange', check);
            setTimeout(resolve, 3000);
          });

          offerText.value = JSON.stringify(peerConnection.localDescription.toJSON(), null, 2);
          updateStatus('Answer ready — copy and send back', false);
          setButtonsState();
        } catch (err) {
          console.error(err);
          updateStatus('❌ ' + err.message, false);
          if (peerConnection) closePeerConnection();
        }
      });

      // ----- COPY -----
      copyOfferBtn.addEventListener('click', () => {
        const txt = offerText.value;
        if (!txt) return;
        navigator.clipboard.writeText(txt).then(() => {
          updateStatus('Copied to clipboard', false);
          setTimeout(() => {
            if (peerConnection && peerConnection.connectionState === 'connected') {
              updateStatus('Friend connected 🎬', true);
            } else {
              updateStatus('Ready', false);
            }
          }, 1500);
        }).catch(() => alert('Copy failed'));
      });

      // ----- HANGUP -----
      hangupBtn.addEventListener('click', () => {
        closePeerConnection();
        answerText.value = '';
        updateStatus('Call ended', false);
        setButtonsState();
      });

      // ----- update button state on text input -----
      answerText.addEventListener('input', setButtonsState);
      offerText.addEventListener('input', setButtonsState);

      // ----- init -----
      setButtonsState();
      updateStatus('Ready — start camera', false);

      window.addEventListener('beforeunload', () => {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        if (peerConnection) peerConnection.close();
      });

    })();
  </script>
</body>
</html>
